name: Release macOS

# только вручную (релиз собирается локально, тег при публикации CI не запускает): Actions -> Release macOS -> Run workflow
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза; пусто - v<версия из pyproject.toml>"
        required: false
        default: ""
      draft:
        description: "Оставить черновиком, чтобы проверить перед публикацией"
        type: boolean
        default: true
      prerelease:
        description: "Пометить как пре-релиз"
        type: boolean
        default: false

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    strategy:
      # архитектуры собираются независимо: падение одной не отменяет другую
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dmg.txt

      - name: Версия
        id: version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "value=$version" >> "$GITHUB_OUTPUT"

      # тесты здесь не гоняем: их прогоняют «Проверки» на каждый пуш, тег ставится на зелёный коммит
      - name: Установка
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r requirements-dmg.txt
          # браузер агента вкладывается в .app при финальной сборке
          python -m playwright install chromium-headless-shell
          python -m ruff check .
          brew install ccache

      # кэш компилятора (ccache через Nuitka): повторная сборка пересобирает только изменившиеся модули
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nuitka-cache
          key: nuitka-macos-${{ matrix.arch }}-${{ hashFiles('pyproject.toml') }}-${{ github.sha }}
          restore-keys: |
            nuitka-macos-${{ matrix.arch }}-${{ hashFiles('pyproject.toml') }}-
            nuitka-macos-${{ matrix.arch }}-

      - name: Сборка Докки.app через Nuitka
        env:
          NUITKA_CACHE_DIR: ${{ runner.temp }}/nuitka-cache
          CCACHE_DIR: ${{ runner.temp }}/nuitka-cache/ccache
          PYTHON: python
        run: JOBS="$(sysctl -n hw.ncpu)" bash scripts/build_macos.sh dist_macos

      - name: DMG
        run: |
          mkdir -p release
          python scripts/build_macos_dmg.py dist_macos/Докки.app \
            --output "release/Dokky-${{ steps.version.outputs.value }}-macOS-${{ matrix.arch }}.dmg"

      - uses: actions/upload-artifact@v6
        with:
          name: dokky-dmg-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v6
        with:
          pattern: dokky-dmg-*
          path: release
          merge-multiple: true

      - name: Релиз
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_INPUT: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="${TAG_INPUT:-v$version}"
          # тег должен совпадать с версией, иначе в приложении и в релизе будут разные номера
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Тег $GITHUB_REF_NAME не совпадает с версией $version в pyproject.toml" >&2
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            DRAFT=false
            PRERELEASE=true
          fi
          cd release
          shasum -a 256 *.dmg > SHA256SUMS-macos.txt
          cd ..
          files=(release/*.dmg release/*.json release/SHA256SUMS-macos.txt)
          # релиз мог уже создать Release Windows: тогда только добавляем файлы
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --clobber
          else
            flags=()
            [ "$DRAFT" = "true" ] && flags+=(--draft)
            [ "$PRERELEASE" = "true" ] && flags+=(--prerelease)
            gh release create "$tag" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "Докки $version" \
              --notes-file CHANGELOG.md \
              "${flags[@]}" || gh release upload "$tag" "${files[@]}" --clobber
          fi
