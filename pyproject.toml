[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "koddi"
version = "0.2.2"
description = "Remote-powered coding agent with FastAPI, HTML desktop UI and rollbackable tools."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "httpx>=0.27.0",
  "anyio>=4.14.2,<5",
  "cryptography>=50.0.0",
  "PyJWT>=2.15.0,<3",
  "soupsieve>=2.9.0,<3",
  "pydantic>=2.8.0",
  "python-multipart>=0.0.9",
  "watchdog>=4.0.0",
  "beautifulsoup4>=4.12.0",
  "playwright>=1.45.0",
  "python-docx>=1.1.0",
  "openpyxl>=3.1.0",
  "pillow>=10.0.0",
  "pytesseract>=0.3.13",
  "mcp>=1.20.0,<2",
  "jsonschema>=4.22.0",
  "regex==2026.9.29",
  "PySide6>=6.7",
  "keyring>=25.0; sys_platform == 'darwin'",
  "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
  "pyobjc-framework-WebKit>=10.3; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff==0.15.20",
  "nuitka>=2.4.0",
]
speech = [
  "openai-whisper>=20240930",
]

[project.scripts]
koddi = "koddi.desktop.web_host:main"
koddi-backend = "koddi.main:main"
koddi-agent = "koddi.cli:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
koddi = ["computer_use/native/*.ps1", "computer_use/native/*.swift", "codeintel/native/*.js", "licenses/**/*.txt", "licenses/*.json", "storage/migrations/*", "desktop/web/*", "desktop/web/assets/*", "desktop/web/vendor/*", "desktop/web-next/*", "desktop/web-next/assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
